<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>

  <style>
    @font-face {
      font-family: "TT Drugs";
      src: url("./fonts/TTDrugs-Regular.woff2") format("woff2"),
           url("./fonts/TTDrugs-Regular.woff") format("woff");
    }

    :root {
      --plum: #3b0d2e;
      --plum-dark: #26071e;
      --rose-line: #8b5360;
      --soft-gray: #e8e6e6;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--plum);
      color: var(--plum);
      font-family: "TT Drugs", "Helvetica Neue", Arial, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .contact-section {
      width: 100%;
      max-width: 900px;
      background: var(--soft-gray);
      padding: 64px 56px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 7vw, 86px);
      font-weight: 300;
      line-height: 1;
      color: var(--plum);
    }

    .heading-line {
      width: 100%;
      height: 2px;
      background: var(--rose-line);
      margin: 18px 0 32px;
    }

    .intro {
      max-width: 700px;
      margin: 0 0 42px;
      font-size: 24px;
      line-height: 1.45;
      color: var(--plum);
    }

    .form-group {
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-family: "TT Drugs", "Helvetica Neue", Arial, sans-serif;
      font-size: 19px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: var(--plum-dark);
    }

    input,
    textarea {
      width: 100%;
      border: 2px solid var(--rose-line);
      background: transparent;
      color: var(--plum-dark);
      font-family: "TT Drugs", "Helvetica Neue", Arial, sans-serif;
      font-size: 22px;
      padding: 16px;
      outline: none;
      border-radius: 0;
    }

    input {
      height: 64px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--plum);
      box-shadow: 0 0 0 3px rgba(59, 13, 46, 0.12);
      background: rgba(255, 255, 255, 0.18);
    }

    button {
      margin-top: 2px;
      padding: 18px 34px;
      border: 2px solid var(--plum);
      background: var(--plum);
      color: var(--white);
      font-family: "TT Drugs", "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      letter-spacing: 6px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: transparent;
      color: var(--plum);
    }

    .bottom-line {
      width: 100%;
      height: 2px;
      background: var(--rose-line);
      margin: 42px 0 28px;
    }

    .contact-details {
      display: grid;
      gap: 12px;
      font-size: 20px;
      color: var(--plum-dark);
    }

    .success-message {
      display: none;
      margin-top: 24px;
      font-size: 20px;
      color: var(--plum);
    }

    @media (max-width: 700px) {
      .page {
        padding: 28px 16px;
      }

      .contact-section {
        padding: 42px 26px;
      }

      .intro {
        font-size: 20px;
      }

      label {
        font-size: 15px;
        letter-spacing: 5px;
      }

      input,
      textarea {
        font-size: 18px;
      }

      button {
        width: 100%;
        font-size: 15px;
        letter-spacing: 4px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="contact-section">
      <h1>Contact Us</h1>
      <div class="heading-line"></div>

      <p class="intro">
        We’d love to hear from you. Please fill out the form below and we’ll get back to you as soon as possible.
      </p>

      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit">Send Message</button>

        <div class="success-message" id="successMessage">
          Thank you! Your message has been sent.
        </div>
      </form>

      <div class="bottom-line"></div>

      <div class="contact-details">
        <div>sabrina@bhatsend.com</div>
        <div>Chicago, IL</div>
        <div>bhatsend.com</div>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("contactForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const button = this.querySelector("button");
      const successMessage = document.getElementById("successMessage");

      button.disabled = true;
      button.textContent = "Sending...";

      const formData = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      };

      await fetch("https://script.google.com/macros/s/AKfycbz7aVBkL3CmUKlW2tzKzhKQZNeSFJii86inhqVezaKBcGfA2vdY_j99ftiPgDd2E9bU/exec", {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(formData)
      });

      successMessage.style.display = "block";
      this.reset();

      button.disabled = false;
      button.textContent = "Send Message";
    });
  </script>
</body>
</html>
